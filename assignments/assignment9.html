<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>COP4813 Assignment 9: Animation</title>
        <link rel="stylesheet" href="../style.css">
        <style>
            .canvas-container {
                background-color: var(--theme-white);
                padding: 2rem;
                max-width: 800px;
                text-align: center;
            }

            h2 {
                color: var(--theme-black);
                margin-top: 0;
                border-bottom: 2px solid var(--theme-cream);
                padding-bottom: 0.5rem;
            }

            canvas {
                background-color: var(--theme-cream);
                border: 4px solid var(--theme-black);
                border-radius: 4px;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
                max-width: 100%;
                height: auto;
                cursor: crosshair; 
            }

            .instructions {
                font-family: 'VT323', monospace, sans-serif;
                font-size: 1.2rem;
                color: var(--theme-darker-orange);
                margin-top: 1rem;
            }

            @media (max-width: 768px) {
                .canvas-container {
                    padding: 1rem;
                    margin: 1rem;
                }
            }

        </style>
    </head>
    <body>
        <div id="nav-placeholder"></div>
        
        <script src="../menu.js"></script>
        <script>loadMenu("../");</script>
        <main>
            <section class="canvas-container">
                <h2>Animated bouncy ball</h2>

                <div class="instructions">
                    Click the target for super speed
                </div>

                <canvas id="bounceCanvas" width="600" height="400"></canvas>
            </section>
        </main>
        <script>
            const canvas = document.getElementById('bounceCanvas');
            const ctx = canvas.getContext('2d');

            // Object properties
            const ball = {
                radius: 30,
                x: 0, 
                y: 0,
                vx: 0,
                vy: 0,
                baseSpeed: 3,
                currentMultiplier: 1,
                isBoosted: false
            };

            function initBall() {
                // Start on the far left side, vertically centered
                ball.x = ball.radius + 10;
                ball.y = canvas.height / 2;

                // Generate a random angle pointing towards the right side of the canvas
                const randomAngle = (Math.random() * Math.PI / 2) - (Math.PI / 4);
                
                // Calculate velocity vectors based on the angle
                ball.vx = Math.cos(randomAngle) * ball.baseSpeed;
                ball.vy = Math.sin(randomAngle) * ball.baseSpeed;
            }

            function drawBall() {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--theme-orange') || '#D96C27';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--theme-black') || '#2A2522';
                ctx.stroke();
                ctx.closePath();
                
                // Smaller inner circle for visual detail
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius / 2, 0, Math.PI * 2);
                ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--theme-cream') || '#F4EBE1';
                ctx.fill();
                ctx.closePath();
            }

            function update() {
                // Clear previous frame
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Calculate current speed
                const currentVx = ball.vx * ball.currentMultiplier;
                const currentVy = ball.vy * ball.currentMultiplier;

                // Move the object
                ball.x += currentVx;
                ball.y += currentVy;

                // Collision detection for left/right walls
                if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= canvas.width) {
                    ball.vx *= -1; // Reverse horizontal direction
                    // Snap back inside bounds to prevent getting stuck in the wall
                    ball.x = ball.x - ball.radius <= 0 ? ball.radius : canvas.width - ball.radius;
                }

                // Collision detection for top/bottom walls
                if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
                    ball.vy *= -1; // Reverse vertical direction
                    // Snap back inside bounds
                    ball.y = ball.y - ball.radius <= 0 ? ball.radius : canvas.height - ball.radius;
                }

                drawBall();

                // Loop the animation
                requestAnimationFrame(update);
            }

            // Trigger the speed boost
            canvas.addEventListener('click', (event) => {
                const rect = canvas.getBoundingClientRect();
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const clickX = (event.clientX - rect.left) * scaleX;
                const clickY = (event.clientY - rect.top) * scaleY;

                const distance = Math.hypot(clickX - ball.x, clickY - ball.y);

                // If the click falls inside the radius, activate boost
                if (distance <= ball.radius && !ball.isBoosted) {
                    ball.isBoosted = true;
                    ball.currentMultiplier = 4; // Increase speed

                    // Reset back to normal after 2.5 seconds
                    setTimeout(() => {
                        ball.currentMultiplier = 1;
                        ball.isBoosted = false;
                    }, 2500);
                }
            });

            initBall();
            update();
        </script>
    </body>
    <footer>
            <p>Created by Noah Maynard</p>    
    </footer>
</html>
